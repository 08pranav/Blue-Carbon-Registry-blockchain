# Frontend (nginx, :3000) + backend (Express, :3001). The backend keeps its data in memory.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
