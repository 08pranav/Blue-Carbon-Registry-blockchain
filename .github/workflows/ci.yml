name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - name: Backend install
        run: npm ci
        working-directory: backend

  contracts:
    name: Smart contracts (Hardhat tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain-deployment/package-lock.json
      - run: npm ci
      - run: npx hardhat test
